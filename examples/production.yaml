# A starting point for a busy site on a dedicated node (here: 8 cores,
# 64 GB, a database of some 10 GB and a few hundred thousand images). The
# numbers come from sites running this chart; scale them with your data.
# A site with millions of images wants several times the OpenSearch heap,
# PostgreSQL memory and mediaproc limits.

# One place for the version of the app, web and mediaproc images
image:
  tag: "1.3.0"

existingSecret: philomena-env

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: philomena.example
    - host: www.philomena.example

web:
  # The pod network: requests reach the pods from the ingress controller
  trustedProxies:
    - 10.244.0.0/16

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "8"
    memory: 6Gi

worker:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

mediaproc:
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "8"
      memory: 16Gi

setupJob:
  # The search index build runs one batch per CPU of the limit
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "8"
      memory: 12Gi
  # Turn on once the first base backup has completed and WAL archiving has
  # caught up: a restore point before every migration
  restorePoint:
    enabled: false

valkey:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

opensearch:
  # Half the container for the heap, the rest is page cache. Requests equal
  # to limits keep it from being evicted first.
  opensearchJavaOpts: "-Xms4g -Xmx4g"
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      cpu: "6"
      memory: 8Gi
  persistence:
    size: 100Gi

postgresql:
  cluster:
    storage:
      size: 100Gi
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "6"
        memory: 8Gi
    postgresql:
      parameters:
        # app + worker + cron + setup Job pools, with room to spare
        max_connections: "256"
        shared_buffers: "2GB"
        effective_cache_size: "6GB"
        maintenance_work_mem: "512MB"
        work_mem: "16MB"
        max_wal_size: "2GB"
        # SSD/NVMe
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
  # Continuous WAL archiving and a nightly base backup to S3, through the
  # CNPG Barman Cloud plugin (which has to be installed, see the README).
  backups:
    enabled: true
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    objectStore:
      helmHook: false  # needed under Argo CD, harmless with Helm
    provider: s3
    endpointURL: https://s3.example.com
    s3:
      bucket: philomena-db-backups
      region: auto
    secret:
      create: false
      name: philomena-backup-s3  # keys ACCESS_KEY_ID and ACCESS_SECRET_KEY
    retentionPolicy: "30d"
    # WAL segments shipped per archive_command call. The default of 1 falls
    # far behind during a restore or a big migration.
    wal:
      maxParallel: 8
    scheduledBackups:
      - name: daily
        schedule: "0 0 2 * * *"  # six fields: seconds first
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io

# Nightly anonymized dump for the public
publicDump:
  enabled: false
  namePrefix: philomena_public_dump
  scratch:
    size: 30Gi  # about three times the public tables
  s3:
    existingSecret: philomena-public-dump-s3  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    endpoint: https://s3.example.com
    bucket: philomena-public-dumps
    region: auto
