{{- range $key, $s := .Values.secrets }}
{{- /* An empty map is enabled with defaults; null (Helm's "remove") is skipped. */}}
{{- if and (kindIs "map" $s) (dig "enabled" true $s) }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $key) }}
{{- fail (printf "secrets.%s: keys must be lowercase alphanumerics and '-' (they become part of resource names)" $key) }}
{{- end }}
{{- $name := include "infisical-secret.defaultName" (dict "release" $.Release.Name "key" $key) }}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "infisical-secret.labels" $ | nindent 4 }}
spec:
  hostAPI: {{ required "hostAPI is required" $.Values.hostAPI | quote }}
  {{- if not (kindIs "invalid" $.Values.resyncInterval) }}
  resyncInterval: {{ $.Values.resyncInterval | int }}
  {{- end }}
  managedKubeSecretReferences:
    - secretName: {{ dig "secretName" "" $s | default $name | quote }}
      secretNamespace: {{ dig "secretNamespace" "" $s | default $.Release.Namespace | quote }}
      creationPolicy: {{ dig "creationPolicy" "" $s | default "Owner" | quote }}
      {{- with dig "secretType" "" $s }}
      secretType: {{ . | quote }}
      {{- end }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ required "credentialsRef.secretName is required" $.Values.credentialsRef.secretName | quote }}
        secretNamespace: {{ $.Values.credentialsRef.secretNamespace | default $.Release.Namespace | quote }}
      secretsScope:
        projectSlug: {{ dig "projectSlug" "" $s | default $.Values.projectSlug | required (printf "projectSlug (or secrets.%s.projectSlug) is required" $key) | quote }}
        envSlug: {{ dig "envSlug" "" $s | default $.Values.envSlug | required (printf "envSlug (or secrets.%s.envSlug) is required" $key) | quote }}
        secretsPath: {{ dig "secretsPath" "" $s | default "/" | quote }}
        recursive: {{ dig "recursive" false $s }}
{{- end }}
{{- end }}
