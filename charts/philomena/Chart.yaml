apiVersion: v2
name: philomena
description: Philomena imageboard with PostgreSQL (CloudNativePG), OpenSearch and Valkey, each replaceable by an external service
type: application
version: 1.0.0
# Philomena release the chart is written for; also the default image tag.
appVersion: "1.3.0"
kubeVersion: ">=1.27.0-0"
home: https://github.com/philomena-dev/helm-charts
icon: https://raw.githubusercontent.com/philomena-dev/philomena/master/assets/static/images/phoenix.svg
sources:
  - https://github.com/philomena-dev/philomena
  - https://github.com/philomena-dev/helm-charts
keywords:
  - philomena
  - booru
  - imageboard
dependencies:
  - name: opensearch
    version: "3.9.0"
    repository: "https://opensearch-project.github.io/helm-charts/"
    condition: opensearch.enabled
  - name: cluster
    alias: postgresql
    version: "0.9.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: postgresql.enabled
  - name: valkey
    version: "0.12.1"
    repository: "https://valkey.io/valkey-helm/"
    condition: valkey.enabled
  - name: infisical-secret
    alias: infisical
    version: "1.0.0"
    repository: "file://../infisical-secret"
    condition: infisical.enabled
maintainers:
  - name: Nighty
    email: luna@nighty.cloud
annotations:
  artifacthub.io/license: MIT
