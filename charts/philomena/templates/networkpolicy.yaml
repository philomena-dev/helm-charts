{{- if .Values.networkPolicy.enabled }}
{{- /*
One policy per bundled service, for both directions. In: the pods running
the app image on the service's port, the service's own pods and
networkPolicy.extraFrom. Out: the service's own pods and the cluster DNS,
which leaves no way out of the cluster. PostgreSQL is only restricted
inwards: its instances need the Kubernetes API and the backup object store.
*/}}
{{- $np := .Values.networkPolicy }}
{{- if .Values.opensearch.enabled }}
{{- $self := include "philomena.subchartSelector" (dict "ctx" . "name" "opensearch") | fromYaml }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "philomena.fullname" . }}-opensearch
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "OpenSearch runs without authentication: only the app pods may reach it, and it reaches nothing but its own nodes."
spec:
  podSelector:
    matchLabels:
      {{- toYaml $self | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- include "philomena.networkPolicy.clients" (dict "ctx" .) | nindent 8 }}
      ports:
        - port: {{ .Values.opensearch.httpPort | int }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $self | nindent 14 }}
    {{- with $np.extraFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $self | nindent 14 }}
    {{- include "philomena.networkPolicy.dns" . | nindent 4 }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $self := include "philomena.subchartSelector" (dict "ctx" . "name" "valkey") | fromYaml }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "philomena.fullname" . }}-valkey
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "Valkey runs without authentication: only the app pods may reach it, and it reaches nothing but its own replicas."
spec:
  podSelector:
    matchLabels:
      {{- toYaml $self | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- include "philomena.networkPolicy.clients" (dict "ctx" .) | nindent 8 }}
      ports:
        - port: {{ .Values.valkey.service.port | int }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $self | nindent 14 }}
    {{- with $np.extraFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $self | nindent 14 }}
    {{- include "philomena.networkPolicy.dns" . | nindent 4 }}
{{- end }}
{{- if .Values.mediaproc.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "philomena.fullname" . }}-mediaproc
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
    app.kubernetes.io/component: mediaproc
  annotations:
    kubernetes.io/description: "mediaproc runs without authentication: only the app pods may reach it, and it reaches nothing."
spec:
  podSelector:
    matchLabels:
      {{- include "philomena.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mediaproc
  # No egress rules: mediaproc only answers the app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- include "philomena.networkPolicy.clients" (dict "ctx" .) | nindent 8 }}
      ports:
        - port: 1500
    {{- with $np.extraFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- /* Instances, the Jobs that create them and poolers */}}
{{- $self := dict "cnpg.io/cluster" (include "philomena.postgresql.fullname" .) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "philomena.fullname" . }}-postgresql
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "Only the app pods and the CloudNativePG operator may reach PostgreSQL."
spec:
  podSelector:
    matchLabels:
      {{- toYaml $self | nindent 6 }}
  # Not Egress: see the top of the file
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "philomena.networkPolicy.clients" (dict "ctx" . "also" (list "public-dump")) | nindent 8 }}
      ports:
        - port: 5432
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml $self | nindent 14 }}
    # The operator polls the instance manager (8000)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.postgresql.operatorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - port: 8000
        - port: 5432
    {{- with $np.extraFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
