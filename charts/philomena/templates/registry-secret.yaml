{{- if .Values.registryCredentials.create }}
{{- $c := .Values.registryCredentials }}
{{- $auth := dict "username" (required "registryCredentials.username is required" $c.username) "password" (required "registryCredentials.password is required" $c.password) "auth" (printf "%s:%s" $c.username $c.password | b64enc) }}
{{- with $c.email }}{{ $_ := set $auth "email" . }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.secretName }}
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $c.registry $auth) | toJson | b64enc }}
{{- end }}
