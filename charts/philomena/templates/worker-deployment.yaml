{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "philomena.fullname" . }}-worker
  labels:
    {{- include "philomena.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    kubernetes.io/description: "Philomena background worker."
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "philomena.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "philomena.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $checksums := include "philomena.appChecksums" . | trim }}
      {{- if or $checksums .Values.podAnnotations }}
      annotations:
        {{- with $checksums }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- include "philomena.appPodSpec" . | nindent 6 }}
      containers:
        - name: philomena-worker
          image: {{ include "philomena.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          workingDir: /srv/philomena
          env:
            - name: START_WORKER
              value: "true"
            {{- include "philomena.appEnv" . | nindent 12 }}
          {{- with include "philomena.envSecretName" . }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- with include "philomena.appVolumeMounts" . | trim }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with include "philomena.appVolumes" . | trim }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
